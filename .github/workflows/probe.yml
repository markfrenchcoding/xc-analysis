name: probe athletic.net

# Temporary. Answers one question: does Cloudflare let a GitHub runner's
# datacenter address through, or only a home connection? Delete once answered.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml', 'pull/probe.js']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --version && curl --version | head -1
      - run: node pull/probe.js
        continue-on-error: true
      - name: commit the answer
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pull/.probe.json
          git commit -m "probe result [skip ci]" || echo "nothing to commit"
          git push
